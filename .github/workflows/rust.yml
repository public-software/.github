# Reusable CI for every Public Software repository. Called from each repo's .github/workflows/ci.yml.
name: rust
on:
  workflow_call:
jobs:
  pub-check:
    name: pub-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skeleton, naming, provenance, catalog
        run: |
          set -e
          for f in Cargo.toml CATALOG.toml PROVENANCE.md README.md deny.toml CODEOWNERS LICENSE-APACHE LICENSE-MIT; do
            test -f "$f" || { echo "::error::missing $f"; exit 1; }
          done
          grep -q '^\[repo\]' CATALOG.toml || { echo "::error::CATALOG.toml has no [repo] table"; exit 1; }
          # crates must be named pub-<repo>-<name>
          repo="${GITHUB_REPOSITORY##*/}"
          for c in crates/*/Cargo.toml; do
            [ -e "$c" ] || continue
            n=$(grep -m1 '^name' "$c" | sed -E 's/.*"([^"]+)".*/\1/')
            case "$n" in pub-$repo|pub-$repo-*) ;; *) echo "::error::crate $n is not named pub-$repo-<name>"; exit 1;; esac
          done
  # A fresh skeleton is a virtual workspace with no members: cargo refuses to load it. The crate-level
  # jobs run only once the repository has at least one crate; until then they are skipped, which GitHub
  # reports as a successful check run, so the same required checks fit empty and populated repositories.
  probe:
    name: probe
    runs-on: ubuntu-latest
    outputs:
      has_crates: ${{ steps.crates.outputs.has_crates }}
    steps:
      - uses: actions/checkout@v4
      - id: crates
        run: |
          if ls crates/*/Cargo.toml >/dev/null 2>&1; then echo "has_crates=true" >> "$GITHUB_OUTPUT"
          else echo "has_crates=false" >> "$GITHUB_OUTPUT"; echo "::notice::no crates yet — test, deny and semver skipped"; fi
  test:
    name: test
    needs: probe
    if: needs.probe.outputs.has_crates == 'true'
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-latest, macos-latest, windows-latest] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --workspace --all-features || cargo test --workspace --all-features
      - run: cargo doc --workspace --no-deps
        env: { RUSTDOCFLAGS: -Dwarnings }
  deny:
    name: deny
    needs: probe
    if: needs.probe.outputs.has_crates == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with: { command: check licenses bans sources }
  semver:
    name: semver
    needs: probe
    if: needs.probe.outputs.has_crates == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: obi1kenobi/cargo-semver-checks-action@v2
        continue-on-error: true   # advisory until the first published release
