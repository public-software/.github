# Reusable agent review for every Public Software repository. The `agent` job reads the pull request against
# the rubric (review/RUBRIC.md, versioned with this release) with the GitHub Copilot CLI, read-only tools and the
# workflow's own token (`copilot-requests: write` bills the AI credits to the organization; no secret exists),
# and returns a structured verdict; `policy` is the deterministic required check ("suite / policy"): it adds the
# trailer and provenance rules, turns hard findings into a failing check and posts one comment, edited in place.
# Called from each repository's .github/workflows/review.yml on pull_request and merge_group; in the merge queue
# the verdict recorded on the pull request stands, so the check-run name is the same and one ruleset serves both.
name: review
on:
  workflow_call:
    inputs:
      model:
        description: the model the reviewer runs on (a Copilot model id; auto lets Copilot pick)
        required: false
        type: string
        default: auto
      max_ai_credits:
        description: cap on AI credits per review (1 credit = $0.01; the CLI's soft cap, minimum 30)
        required: false
        type: number
        default: 100
permissions:
  contents: read
jobs:
  agent:
    name: agent
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read           # the checkout and the diff
      pull-requests: read      # gh pr view / gh pr diff
      copilot-requests: write  # the Copilot CLI on the workflow token, billed to the organization
    outputs:
      verdict: ${{ steps.verdict.outputs.verdict }}
      skipped: ${{ steps.gate.outputs.skipped }}
    steps:
      - id: gate
        env:
          IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          skipped=""
          if [ "$IS_DRAFT" = "true" ]; then skipped=draft
          elif [ "$IS_FORK" = "true" ]; then skipped=fork; fi   # a fork's token carries no Copilot permission
          echo "skipped=$skipped" >> "$GITHUB_OUTPUT"
          [ -z "$skipped" ] || echo "::notice::agent review skipped ($skipped); suite / policy still runs the deterministic checks"
      - if: steps.gate.outputs.skipped == ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: The rubric of this release
        if: steps.gate.outputs.skipped == ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .pub-review
          persist-credentials: false
      - name: The Copilot CLI of this release   # an exact version, bumped by hand with the release (no Dependabot ecosystem sees it)
        if: steps.gate.outputs.skipped == ''
        run: npm install -g @github/copilot@1.0.82   # zizmor: ignore[adhoc-packages] an exact version; a global install has no lockfile
      - id: review
        if: steps.gate.outputs.skipped == ''
        env:
          GITHUB_TOKEN: ${{ github.token }}   # what the CLI authenticates with (copilot-requests: write) and what gh reads
          MODEL: ${{ inputs.model }}
          MAX_AI_CREDITS: ${{ inputs.max_ai_credits }}
          PROMPT: |
            You are the review gate of Public Software. Review pull request #${{ github.event.pull_request.number }}
            of ${{ github.repository }} against the rubric in .pub-review/review/RUBRIC.md: read the rubric first,
            then this repository's PROVENANCE.md and, when it exists, AGENTS.md. The pull request branch is
            checked out in the working directory; `gh pr diff` shows the change and `gh pr view --json title,body`
            its description. Judge, do not fix: you have no write tools. Report one finding per rubric rule the
            change breaks, with the rule id, the severity the rubric gives it, one line of detail and a file:line
            location when there is one; report nothing for a rule the change satisfies. Answer with one JSON
            object and nothing else, no prose and no code fence, of this exact shape:
            {"summary": "<one or two sentences>", "findings": [{"rule": "<scope|tests|provenance|trailer|secrets|semver|agents>", "severity": "<hard|soft>", "detail": "<one line>", "location": "<file:line or empty>"}]}
            The rule ids are exactly "scope", "tests", "provenance", "trailer", "secrets", "semver" and "agents".
        # read-only by construction: a deny rule beats every allow, so no file write and no URL fetch can happen;
        # the shell allow list is the five read commands; the builtin GitHub MCP server is off (gh is the one
        # channel to GitHub) and the branch's own AGENTS.md is not loaded as instructions (the prompt names it as
        # something to judge against, never as something to obey)
        run: |
          rc=0
          copilot -p "$PROMPT" -s --no-color --no-ask-user --no-custom-instructions --disable-builtin-mcps \
            --model "$MODEL" --max-ai-credits "$MAX_AI_CREDITS" \
            --deny-tool=write --deny-tool=url \
            --allow-tool='shell(gh pr diff:*)' --allow-tool='shell(gh pr view:*)' \
            --allow-tool='shell(git log:*)' --allow-tool='shell(git diff:*)' --allow-tool='shell(git show:*)' \
            --usage-output-file usage.json > answer.txt 2> copilot.log || rc=$?
          cat copilot.log
          if [ -s usage.json ]; then { echo '### Agent review usage'; echo; echo '```json'; cat usage.json; echo; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
          if [ "$rc" != 0 ]; then
            echo "::error::the Copilot CLI exited $rc; if the log shows an authentication or entitlement error, the organization policy \"Allow use of Copilot CLI billed to the organization\" is off (organization Settings → Copilot → Policies; Copilot Business)"
            exit "$rc"
          fi
      - id: verdict
        if: steps.gate.outputs.skipped == ''
        run: |
          bash .pub-review/review/verdict.sh answer.txt verdict.json
          echo "verdict=$(cat verdict.json)" >> "$GITHUB_OUTPUT"
  policy:
    name: policy
    needs: agent
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # the one review comment, edited in place
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: The policy of this release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .pub-review
          persist-credentials: false
      - name: Gather the pull request
        if: github.event_name == 'pull_request'
        run: |
          gh api "repos/$REPO/pulls/$NUMBER/commits" --paginate --jq '.[] | {sha, message: .commit.message}' | jq -s . > commits.json
          gh pr view "$NUMBER" --repo "$REPO" --json body --jq .body > body.txt
          gh pr diff "$NUMBER" --repo "$REPO" \
            | awk '/^\+\+\+ b\/PROVENANCE\.md$/ { p = 1; next } /^\+\+\+ / { p = 0 } p && /^\+/ { print substr($0, 2) }' > provenance-added.txt
      - id: verdict
        env:
          VERDICT: ${{ needs.agent.outputs.verdict }}
          AGENT_RESULT: ${{ needs.agent.result }}
          AGENT_SKIPPED: ${{ github.event_name == 'merge_group' && 'merge_group' || needs.agent.outputs.skipped }}
          RUBRIC_URL: https://github.com/${{ job.workflow_repository }}/blob/${{ job.workflow_sha }}/review/RUBRIC.md
        run: |
          printf '%s' "$VERDICT" > verdict.json
          rc=0; bash .pub-review/review/policy.sh verdict.json commits.json body.txt provenance-added.txt > comment.md || rc=$?
          cat comment.md >> "$GITHUB_STEP_SUMMARY"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
      - name: One comment, edited in place
        if: github.event_name == 'pull_request'
        run: |
          id="$(gh api "repos/$REPO/issues/$NUMBER/comments" --paginate --jq '.[] | select(.body | startswith("<!-- pub-review -->")) | .id' | head -n1)"
          if [ -n "$id" ]; then gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@comment.md > /dev/null
          else gh api -X POST "repos/$REPO/issues/$NUMBER/comments" -F body=@comment.md > /dev/null
          fi || echo "::warning::could not post the review comment (a fork's token is read-only); the verdict is in the job summary"
      - name: Gate
        env:
          RC: ${{ steps.verdict.outputs.rc }}
        run: |
          [ "$RC" = "0" ] || echo "::error::suite / policy: hard findings block the merge; see the review comment"
          exit "$RC"
