# Push-mirror every branch and tag to the canonical forge. Needs org variable FORGE_MIRROR_URL and secret FORGE_MIRROR_TOKEN.
name: mirror
on:
  workflow_call:
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: |
          repo="${GITHUB_REPOSITORY##*/}"
          git remote add forge "${{ vars.FORGE_MIRROR_URL }}/public-software/$repo.git"
          git push --mirror "https://x-token-auth:${{ secrets.FORGE_MIRROR_TOKEN }}@${FORGE_HOST}/public-software/$repo.git" || echo "::warning::mirror push failed"
        env:
          FORGE_HOST: ${{ vars.FORGE_MIRROR_URL }}
